name: Docker Build and Push
permissions:
  contents: read
  packages: write
  
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker tag'
        required: true
        default: 'latest'
      build_main:
        description: 'Main App neu bauen?'
        type: boolean
        default: true

jobs:
  manual_docker_build:
    name: 🛠️ Manual Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dieser Schritt läuft nur, wenn du beim Starten den Haken bei "Main App neu bauen?" lässt
      - name: Build and push Main App
        if: ${{ inputs.build_main }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/filebrowser:${{ inputs.tag }}
            ghcr.io/${{ github.repository_owner }}/filebrowser:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
